services:
  gateway:
    build: .
    image: llm-gateway:latest
    ports:
      - '8080:8080'
    env_file:
      - path: .env
        required: false
    environment:
      # Safe offline defaults; override in .env
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-demo:sk-gw-demo-change-me}
      ENABLE_MOCK_PROVIDER: ${ENABLE_MOCK_PROVIDER:-true}
      USAGE_LOG_PATH: /data/usage.jsonl
    volumes:
      - usage:/data
    restart: unless-stopped

  # Optional local models: docker compose --profile ollama up
  # and set OLLAMA_BASE_URL=http://ollama:11434 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ['ollama']
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama

volumes:
  usage:
  ollama:
